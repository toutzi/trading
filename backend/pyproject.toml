[project]
name = "devteam-backend"
version = "1.0.0"
description = "FastAPI backend for the auth vertical slice (v1 contract)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "bcrypt==5.0.0",
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
